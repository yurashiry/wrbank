<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WR Bank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            color: #fff;
            min-height: 100vh;
        }
        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        /* страница входа */
        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        .yandex-btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
        }
        /* навигация */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 400px;
            background: rgba(20, 28, 45, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            display: flex;
            justify-content: space-around;
            padding: 8px 12px;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item.active .nav-icon-wrapper {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 4px 12px rgba(99,102,241,0.4);
        }
        .nav-item.active .nav-icon {
            stroke: white;
        }
        .nav-icon-wrapper {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            stroke: #8e9aaf;
            fill: none;
            stroke-width: 2;
        }
        .nav-label {
            font-size: 11px;
            color: #8e9aaf;
        }
        /* карточки счетов */
        .account-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .account-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .account-currency {
            font-size: 24px;
            font-weight: 700;
        }
        .account-balance {
            font-size: 20px;
            font-weight: 600;
        }
        .btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            padding: 14px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
        }
        .empty-state {
            text-align: center;
            padding: 48px;
            color: #64748b;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1e293b;
            border-radius: 28px;
            padding: 24px;
            width: 90%;
            max-width: 360px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
        }
        .message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
        }
        .message.error { background: rgba(239,68,68,0.2); color: #f87171; }
        .message.success { background: rgba(34,197,94,0.2); color: #4ade80; }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    // ========== КОНФИГ ==========
    const YANDEX_CLIENT_ID = '326bda7e29c54835b4683bc71190b054';
    const API_BASE_URL = 'https://functions.yandexcloud.net/d4e4te08so9b9ml37hmv';
    // Автоматически определяем redirect_uri (текущий адрес страницы)
    const REDIRECT_URI = window.location.origin + window.location.pathname;

    let currentUser = null;
    let currentPage = 'dashboard';

    // ---------- Яндекс OAuth ----------
    function getTokenFromUrl() {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('access_token');
        if (token) {
            localStorage.setItem('yandex_token', token);
            // Очищаем hash из URL, чтобы не мешал
            window.history.replaceState(null, '', window.location.pathname);
            return token;
        }
        return localStorage.getItem('yandex_token');
    }

    function redirectToYandexAuth() {
        const authUrl = `https://oauth.yandex.ru/authorize?response_type=token&client_id=${YANDEX_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
        window.location.href = authUrl;
    }

    async function fetchYandexUser(token) {
        try {
            const resp = await fetch('https://login.yandex.ru/info?format=json', {
                headers: { 'Authorization': `OAuth ${token}` }
            });
            const data = await resp.json();
            return {
                id: data.id,
                name: data.real_name || data.login,
                email: data.default_email,
                phone: data.default_phone?.number || '—',
                avatar: data.default_avatar_id ? `https://avatars.yandex.net/get-yapic/${data.default_avatar_id}/islands-200` : null
            };
        } catch(e) {
            console.error('Ошибка получения данных:', e);
            return null;
        }
    }

    // ---------- API (заглушка, пока функция не готова) ----------
    async function callApi(action, data) {
        try {
            const resp = await fetch(API_BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, ...data })
            });
            return await resp.json();
        } catch(e) {
            console.warn('API не отвечает, используем localStorage');
            // Если функция не работает — используем локальное демо-хранилище
            return null;
        }
    }

    async function loadUserFromServer(userId) {
        // Пытаемся получить из облачной функции
        const result = await callApi('getUser', { userId });
        if (result && result.success) return result.user;
        
        // Если нет — берём из localStorage или создаём демо-пользователя
        let local = localStorage.getItem(`wr_user_${userId}`);
        if (local) return JSON.parse(local);
        
        // Создаём нового пользователя с 2 счетами
        const newUser = {
            id: userId,
            name: 'Загрузка...',
            email: '',
            phone: '',
            avatar: null,
            accounts: [
                { id: 'acc1', currency: 'Ÿ', balance: 1250.75, number: 'WR****1234', cards: [] },
                { id: 'acc2', currency: '$', balance: 350.50, number: 'WR****5678', cards: [] }
            ],
            transactions: []
        };
        localStorage.setItem(`wr_user_${userId}`, JSON.stringify(newUser));
        return newUser;
    }

    async function saveUserToServer(user) {
        await callApi('updateProfile', user);
        localStorage.setItem(`wr_user_${user.id}`, JSON.stringify(user));
    }

    async function createAccount(userId, currency) {
        const user = await loadUserFromServer(userId);
        if (user.accounts.length >= 7) {
            return { success: false, error: 'Максимум 7 счетов' };
        }
        user.accounts.push({
            id: 'acc' + Date.now(),
            currency: currency,
            balance: 0,
            number: `WR****${Math.floor(1000+Math.random()*9000)}`,
            cards: []
        });
        await saveUserToServer(user);
        if (currentUser?.id === userId) currentUser = user;
        return { success: true };
    }

    async function transferMoney(senderId, recipientId, amount, currency, note, accountId) {
        const sender = await loadUserFromServer(senderId);
        const recipient = await loadUserFromServer(recipientId);
        
        const acc = sender.accounts.find(a => a.id === accountId);
        if (!acc) return { success: false, error: 'Счёт не найден' };
        if (acc.balance < amount) return { success: false, error: 'Недостаточно средств' };
        
        acc.balance -= amount;
        
        let recipientAcc = recipient.accounts.find(a => a.currency === currency);
        if (!recipientAcc) {
            recipientAcc = { id: 'acc'+Date.now(), currency, balance: 0, number: `WR****${Math.floor(1000+Math.random()*9000)}`, cards: [] };
            recipient.accounts.push(recipientAcc);
        }
        recipientAcc.balance += amount;
        
        const txOut = {
            id: Date.now(), type: 'outgoing', amount, currency, recipient: recipientId,
            recipientName: recipient.name, note, date: new Date().toISOString(), accountId
        };
        const txIn = {
            id: Date.now(), type: 'incoming', amount, currency, sender: senderId,
            senderName: sender.name, note, date: new Date().toISOString(), accountId: recipientAcc.id
        };
        sender.transactions = [txOut, ...(sender.transactions || [])];
        recipient.transactions = [txIn, ...(recipient.transactions || [])];
        
        await saveUserToServer(sender);
        await saveUserToServer(recipient);
        if (currentUser?.id === senderId) currentUser = sender;
        return { success: true };
    }

    // ---------- Отрисовка UI ----------
    function render() {
        const token = getTokenFromUrl();
        if (!token) {
            renderLogin();
        } else if (!currentUser) {
            document.getElementById('root').innerHTML = '<div style="text-align:center;padding:50px">Загрузка...</div>';
            fetchYandexUser(token).then(async yUser => {
                if (yUser) {
                    let user = await loadUserFromServer(yUser.id);
                    user.name = yUser.name;
                    user.email = yUser.email;
                    user.phone = yUser.phone;
                    user.avatar = yUser.avatar;
                    await saveUserToServer(user);
                    currentUser = user;
                    renderApp();
                } else {
                    renderLogin();
                }
            });
        } else {
            renderApp();
        }
    }

    function renderLogin() {
        const root = document.getElementById('root');
        root.innerHTML = `
            <div class="app">
                <div class="login-container">
                    <div class="logo">WR Bank</div>
                    <h1>Добро пожаловать</h1>
                    <p style="color:#94a3b8">Внутренний банк с Яндекс ID</p>
                    <button class="yandex-btn" id="yandexBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M2.04 12.15c-.04-.28-.04-.56 0-.84.12-.84.6-1.56 1.32-2.04.72-.48 1.56-.72 2.44-.72 1.28 0 2.36.44 3.2 1.32.84.88 1.28 1.96 1.28 3.24 0 1.28-.44 2.36-1.28 3.24-.84.88-1.92 1.32-3.2 1.32-.88 0-1.72-.24-2.44-.72-.72-.48-1.2-1.2-1.32-2.04-.04-.28-.04-.56 0-.84z"/></svg>
                        Войти через Яндекс
                    </button>
                </div>
            </div>
        `;
        document.getElementById('yandexBtn')?.addEventListener('click', redirectToYandexAuth);
    }

    function renderApp() {
        const root = document.getElementById('root');
        root.innerHTML = `
            <div class="app">
                <div class="main-content" id="mainContent"></div>
                <div class="bottom-nav">
                    <div class="nav-item" data-page="dashboard"><div class="nav-icon-wrapper"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-6 9 6v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><span class="nav-label">Обзор</span></div>
                    <div class="nav-item" data-page="accounts"><div class="nav-icon-wrapper"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div><span class="nav-label">Счета</span></div>
                    <div class="nav-item" data-page="transfer"><div class="nav-icon-wrapper"><svg class="nav-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 5 19 12"/><polyline points="5 12 12 19 19 12"/></svg></div><span class="nav-label">Перевод</span></div>
                    <div class="nav-item" data-page="transactions"><div class="nav-icon-wrapper"><svg class="nav-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div><span class="nav-label">История</span></div>
                    <div class="nav-item" data-page="settings"><div class="nav-icon-wrapper"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div><span class="nav-label">Настройки</span></div>
                </div>
                <div id="transferModal" class="modal"><div class="modal-content" id="transferModalContent"></div></div>
                <div id="accountModal" class="modal"><div class="modal-content"><h3>Новый счёт</h3><select id="newAccCurrency"><option value="Ÿ">Ÿ (ATY)</option><option value="$">$ (USD)</option></select><button class="btn" id="createAccBtn">Создать</button><div id="accMsg"></div><button class="modal-close" style="margin-top:12px;background:none;border:none;color:#94a3b8">Закрыть</button></div></div>
            </div>
        `;
        
        // Навигация
        document.querySelectorAll('.nav-item').forEach(el => {
            el.addEventListener('click', () => loadPage(el.dataset.page));
        });
        // Модалки
        document.querySelectorAll('.modal-close').forEach(btn => {
            btn.addEventListener('click', () => btn.closest('.modal')?.classList.remove('active'));
        });
        
        loadPage('dashboard');
    }

    async function loadPage(page) {
        currentPage = page;
        document.querySelectorAll('.nav-item').forEach(el => {
            if (el.dataset.page === page) el.classList.add('active');
            else el.classList.remove('active');
        });
        const container = document.getElementById('mainContent');
        if (!container) return;
        
        if (page === 'dashboard') await renderDashboard(container);
        else if (page === 'accounts') await renderAccounts(container);
        else if (page === 'transfer') openTransferModal();
        else if (page === 'transactions') await renderTransactions(container);
        else if (page === 'settings') renderSettings(container);
    }

    async function renderDashboard(container) {
        const total = currentUser.accounts.reduce((s, a) => s + a.balance, 0);
        const recent = (currentUser.transactions || []).slice(0, 5);
        container.innerHTML = `
            <div style="text-align:center;margin:20px 0"><div style="font-size:14px;color:#94a3b8">Общий баланс</div><div style="font-size:36px;font-weight:700">${total.toFixed(2)} WR</div></div>
            <button class="btn" id="quickTransferBtn">📤 Быстрый перевод</button>
            <div style="margin:24px 0 12px;display:flex;justify-content:space-between"><h3>Мои счета</h3><button id="newAccountBtn" style="background:none;border:none;color:#a78bfa">+ Создать</button></div>
            <div id="accountsPreview"></div>
            <h3 style="margin:20px 0 12px">Последние операции</h3>
            <div id="recentTxs"></div>
        `;
        const preview = document.getElementById('accountsPreview');
        preview.innerHTML = currentUser.accounts.map(acc => `
            <div class="account-card">
                <div class="account-header"><span class="account-currency">${acc.currency}</span><span>${acc.balance.toFixed(2)} ${acc.currency === 'Ÿ' ? 'WR' : 'USD'}</span></div>
                <div>${acc.number}</div>
                <div style="font-size:12px;color:#94a3b8">${acc.cards.length}/3 карт</div>
            </div>
        `).join('');
        if (!currentUser.accounts.length) preview.innerHTML = '<div class="empty-state">Нет счетов</div>';
        
        const txsDiv = document.getElementById('recentTxs');
        if (recent.length) {
            txsDiv.innerHTML = recent.map(tx => `
                <div style="background:rgba(30,41,59,0.4);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between">
                    <div><div>${tx.type === 'outgoing' ? `→ ${tx.recipientName || tx.recipient}` : `← ${tx.senderName || tx.sender}`}</div><div style="font-size:11px;color:#64748b">${new Date(tx.date).toLocaleDateString()}</div>${tx.note ? `<div style="font-size:11px">${tx.note}</div>` : ''}</div>
                    <div style="color:${tx.type === 'outgoing' ? '#ef4444' : '#22c55e'}">${tx.type === 'outgoing' ? '-' : '+'}${tx.amount} ${tx.currency === 'Ÿ' ? 'WR' : '$'}</div>
                </div>
            `).join('');
        } else {
            txsDiv.innerHTML = '<div class="empty-state">Нет операций</div>';
        }
        
        document.getElementById('quickTransferBtn')?.addEventListener('click', openTransferModal);
        document.getElementById('newAccountBtn')?.addEventListener('click', openAccountModal);
    }

    async function renderAccounts(container) {
        container.innerHTML = `<div style="display:flex;justify-content:space-between;margin-bottom:20px"><h2>Счета</h2><button id="newAccBtn" style="background:#3b82f6;border:none;padding:8px 16px;border-radius:20px">+ Новый</button></div><div id="accountsList"></div>`;
        const listDiv = document.getElementById('accountsList');
        listDiv.innerHTML = currentUser.accounts.map(acc => `
            <div class="account-card">
                <div class="account-header"><span class="account-currency">${acc.currency}</span><span>${acc.balance.toFixed(2)} ${acc.currency === 'Ÿ' ? 'WR' : 'USD'}</span></div>
                <div>${acc.number}</div>
                <div style="display:flex;justify-content:space-between;margin-top:12px"><span>${acc.cards.length}/3 карт</span><button class="viewCardsBtn" data-id="${acc.id}" style="background:#3b82f6;border:none;padding:4px 12px;border-radius:16px">Карты</button></div>
            </div>
        `).join('');
        document.getElementById('newAccBtn')?.addEventListener('click', openAccountModal);
        document.querySelectorAll('.viewCardsBtn').forEach(btn => {
            btn.addEventListener('click', () => alert('Выпуск карт будет добавлен позже!'));
        });
    }

    async function renderTransactions(container) {
        const txs = currentUser.transactions || [];
        container.innerHTML = `<h2>История</h2><div id="txList"></div>`;
        const list = document.getElementById('txList');
        if (txs.length) {
            list.innerHTML = txs.map(tx => `
                <div style="background:rgba(30,41,59,0.4);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between">
                    <div><div>${tx.type === 'outgoing' ? `→ ${tx.recipientName || tx.recipient}` : `← ${tx.senderName || tx.sender}`}</div><div style="font-size:11px;color:#94a3b8">${new Date(tx.date).toLocaleString()}</div>${tx.note ? `<div style="font-size:12px">${tx.note}</div>` : ''}</div>
                    <div style="color:${tx.type === 'outgoing' ? '#ef4444' : '#22c55e'}">${tx.type === 'outgoing' ? '-' : '+'}${tx.amount} ${tx.currency === 'Ÿ' ? 'WR' : '$'}</div>
                </div>
            `).join('');
        } else {
            list.innerHTML = '<div class="empty-state">Нет транзакций</div>';
        }
    }

    function renderSettings(container) {
        container.innerHTML = `
            <h2>Настройки</h2>
            <div style="background:rgba(30,41,59,0.6);border-radius:20px;padding:20px;margin-top:16px">
                <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px"><div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:24px">${(currentUser.name?.charAt(0) || 'U').toUpperCase()}</div><div><h3>${currentUser.name}</h3><p>${currentUser.email}</p></div></div>
                <div><label style="color:#94a3b8">Ваш ID</label><input type="text" readonly value="${currentUser.id}" style="width:100%;background:#0f172a;border:none;padding:12px;border-radius:12px;color:white"></div>
                <div><label style="color:#94a3b8">Телефон</label><input type="text" readonly value="${currentUser.phone}" style="width:100%;background:#0f172a;border:none;padding:12px;border-radius:12px;color:white"></div>
                <button class="btn" id="logoutBtn" style="margin-top:20px;background:rgba(239,68,68,0.2);color:#f87171">Выйти</button>
            </div>
        `;
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.clear();
            location.reload();
        });
    }

    function openTransferModal() {
        const modal = document.getElementById('transferModal');
        const content = document.getElementById('transferModalContent');
        content.innerHTML = `
            <h3>Перевод</h3>
            <div class="form-group"><label>Счёт списания</label><select id="txAccountId">${currentUser.accounts.map(a => `<option value="${a.id}">${a.currency} — ${a.balance.toFixed(2)}</option>`).join('')}</select></div>
            <div class="form-group"><label>Получатель (ID)</label><input id="txRecipient" placeholder="ID получателя"></div>
            <div class="form-group"><label>Сумма</label><input id="txAmount" type="number" step="0.01" placeholder="0.00"></div>
            <div class="form-group"><label>Назначение</label><input id="txNote" placeholder="Необязательно"></div>
            <button class="btn" id="doTransferBtn">Отправить</button>
            <div id="txMsg" class="message"></div>
            <button class="modal-close" style="margin-top:12px;background:none;border:none;color:#94a3b8">Закрыть</button>
        `;
        modal.classList.add('active');
        document.getElementById('doTransferBtn')?.addEventListener('click', async () => {
            const accId = document.getElementById('txAccountId').value;
            const to = document.getElementById('txRecipient').value.trim();
            const amount = parseFloat(document.getElementById('txAmount').value);
            const note = document.getElementById('txNote').value;
            const msgDiv = document.getElementById('txMsg');
            if (!to || isNaN(amount) || amount <= 0) { msgDiv.innerHTML = '<div class="message error">Заполните поля</div>'; return; }
            const acc = currentUser.accounts.find(a => a.id === accId);
            if (amount > acc.balance) { msgDiv.innerHTML = '<div class="message error">Недостаточно средств</div>'; return; }
            msgDiv.innerHTML = '<div class="message">Отправка...</div>';
            const result = await transferMoney(currentUser.id, to, amount, acc.currency, note, accId);
            if (result.success) {
                msgDiv.innerHTML = '<div class="message success">Перевод выполнен</div>';
                setTimeout(() => { modal.classList.remove('active'); loadPage(currentPage); }, 1500);
            } else {
                msgDiv.innerHTML = `<div class="message error">${result.error}</div>`;
            }
        });
    }

    function openAccountModal() {
        const modal = document.getElementById('accountModal');
        modal.classList.add('active');
        document.getElementById('createAccBtn')?.addEventListener('click', async () => {
            const currency = document.getElementById('newAccCurrency').value;
            const result = await createAccount(currentUser.id, currency);
            const msgDiv = document.getElementById('accMsg');
            if (result.success) {
                msgDiv.innerHTML = '<div class="message success">Счёт создан</div>';
                setTimeout(() => { modal.classList.remove('active'); loadPage('accounts'); }, 1000);
            } else {
                msgDiv.innerHTML = `<div class="message error">${result.error}</div>`;
            }
        });
    }

    // Запуск
    render();
</script>
</body>
</html>
